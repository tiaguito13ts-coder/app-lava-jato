<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #C9A445;
  --dourado-bg: #2A2415;
  --fundo: #0E0D0B;
  --superficie: #1B1815;
  --borda: #33302A;
  --texto: #F5F1E8;
  --texto-secundario: #A69C89;
  --azul-bg: #1B2C40; --azul-texto: #8FB4DC;
  --verde-bg: #23301A; --verde-texto: #A9C97D;
  --vermelho-bg: #3A1F1B; --vermelho-texto: #E0958A;
  --ambar-bg: #3A2A14; --ambar-texto: #E3B876;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--texto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 20px; }
.topo .icone-marca { width: 56px; height: auto; margin-bottom: 6px; }
.topo .nome-marca { font-family: 'Playfair Display', serif; font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto); margin: 0; }
.linha-assinatura { width: 36px; height: 2px; background: var(--dourado); margin: 8px auto 0; }
a.voltar { font-size: 13px; color: var(--dourado); text-decoration: none; display: inline-block; margin-bottom: 12px; font-weight: 500; }
a.voltar:hover { text-decoration: underline; }
h1 { font-family: 'Playfair Display', serif; font-size: 17px; font-weight: 700; margin: 0 0 2px; }
p.subtitulo { font-size: 12px; color: var(--texto-secundario); margin: 0 0 14px; }

.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; margin-bottom: 20px; }
.badge.agendado { background: var(--superficie); color: var(--texto-secundario); border: 1px solid var(--borda); }
.badge.em_andamento { background: var(--azul-bg); color: var(--azul-texto); }
.badge.concluido { background: var(--verde-bg); color: var(--verde-texto); }
.badge.cancelado { background: var(--vermelho-bg); color: var(--vermelho-texto); }
.badge.disputa { background: var(--ambar-bg); color: var(--ambar-texto); }

h2 { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; color: var(--texto-secundario); margin: 0 0 8px; }

.foto-bloco { margin-bottom: 18px; }
.galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
.foto-box {
  aspect-ratio: 4/3;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--texto-secundario);
  cursor: pointer;
}
.foto-box img { width: 100%; height: 100%; object-fit: cover; }
.foto-box.vazia { grid-column: span 2; cursor: default; }
input[type="file"] { display: none; }
label.botao-foto {
  display: block;
  width: 100%;
  padding: 11px;
  text-align: center;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: var(--texto);
  cursor: pointer;
}
label.botao-foto:hover { border-color: var(--dourado); }
label.botao-foto.enviando { opacity: 0.6; pointer-events: none; }
p.limite-fotos { font-size: 12px; color: var(--texto-secundario); text-align: center; margin: 0; }

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 24px;
  cursor: zoom-out;
}
.lightbox.aberto { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

.status-lista { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.status-botao {
  width: 100%;
  text-align: left;
  padding: 11px 12px;
  border-radius: 6px;
  border: 1px solid var(--borda);
  background: var(--superficie);
  color: var(--texto);
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
}
.status-botao.passado { opacity: 0.4; cursor: default; }
.status-botao.atual { border: 2px solid var(--azul-texto); background: var(--azul-bg); color: var(--azul-texto); cursor: default; }
.status-botao.futuro { cursor: pointer; }
.status-botao.futuro:hover { border-color: var(--dourado); }

.mensagem-erro { font-size: 12px; color: var(--vermelho-texto); background: var(--vermelho-bg); padding: 8px 10px; border-radius: 6px; margin: 8px 0; display: none; }
.mensagem-erro.visivel { display: block; }
button.cancelar {
  width: 100%;
  padding: 11px;
  background: transparent;
  color: var(--vermelho-texto);
  border: 1px solid var(--vermelho-bg);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 16px;
}
button.cancelar:hover { background: var(--vermelho-bg); }
.carregando, .erro { font-size: 13px; color: var(--texto-secundario); text-align: center; padding: 40px 0; }
</style>
</head>
<body>

<div class="tela" id="tela">
  <p class="carregando">Carregando...</p>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="Foto ampliada">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const parametros = new URLSearchParams(window.location.search);
const agendamentoId = parametros.get("id");

const tela = document.getElementById("tela");

const rotulosStatus = {
  agendado: "Agendado",
  em_andamento: "Em andamento",
  concluido: "Concluído",
  cancelado: "Cancelado",
  disputa: "Em análise"
};

const ordemStatus = ["agendado", "em_andamento", "concluido"];
const LIMITE_FOTOS_POR_TIPO = 10;

function formatarDataHora(isoString) {
  const data = new Date(isoString);
  return data.toLocaleDateString("pt-BR") + " às " +
         data.getHours().toString().padStart(2, "0") + ":" +
         data.getMinutes().toString().padStart(2, "0");
}

function abrirLightbox(url) {
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("aberto");
}
function fecharLightbox() {
  document.getElementById("lightbox").classList.remove("aberto");
}
document.getElementById("lightbox").addEventListener("click", fecharLightbox);

async function carregarTela() {
  if (!agendamentoId) {
    tela.innerHTML = '<p class="erro">Agendamento não encontrado.</p>';
    return;
  }

  try {
    const { data: agendamento, error: erroAgendamento } = await db
      .from("agendamentos")
      .select("id, data_hora, status, clientes(nome, telefone), veiculos(placa, modelo, cor)")
      .eq("id", agendamentoId)
      .single();

    if (erroAgendamento) throw erroAgendamento;

    const { data: fotos, error: erroFotos } = await db
      .from("fotos")
      .select("tipo, url")
      .eq("agendamento_id", agendamentoId)
      .order("timestamp_servidor", { ascending: true });

    if (erroFotos) throw erroFotos;

    const fotosAntes = fotos.filter(function (f) { return f.tipo === "antes"; });
    const fotosDepois = fotos.filter(function (f) { return f.tipo === "depois"; });

    const veiculo = agendamento.veiculos;
    const cliente = agendamento.clientes;

    tela.innerHTML =
      '<div class="topo"><img src="icone-carro.png" alt="" class="icone-marca"><p class="nome-marca">No Capricho</p><div class="linha-assinatura"></div></div>' +
      '<a class="voltar" href="agenda.html">&larr; Agenda do dia</a>' +
      '<h1>' + (veiculo.modelo || veiculo.placa) + ' — ' + cliente.nome + '</h1>' +
      '<p class="subtitulo">' + formatarDataHora(agendamento.data_hora) + ' · ' + veiculo.placa + '</p>' +
      '<span class="badge ' + agendamento.status + '" id="badge-status">' + rotulosStatus[agendamento.status] + '</span>' +

      '<h2>Fotos de antes (' + fotosAntes.length + '/' + LIMITE_FOTOS_POR_TIPO + ')</h2>' +
      '<div class="foto-bloco">' + gerarGaleria(fotosAntes, "antes") + '</div>' +

      '<h2>Fotos de depois (' + fotosDepois.length + '/' + LIMITE_FOTOS_POR_TIPO + ')</h2>' +
      '<div class="foto-bloco">' + gerarGaleria(fotosDepois, "depois") + '</div>' +

      '<h2>Status</h2>' +
      '<div class="status-lista" id="status-lista"></div>' +
      '<p class="mensagem-erro" id="mensagem-erro"></p>' +
      (agendamento.status !== "concluido" && agendamento.status !== "cancelado"
        ? '<button type="button" class="cancelar" id="botao-cancelar">Cancelar agendamento</button>'
        : "");

    montarBotoesDeStatus(agendamento.status);
    ligarInputsDeFoto();
    ligarCliqueNasFotos();

    const botaoCancelar = document.getElementById("botao-cancelar");
    if (botaoCancelar) {
      botaoCancelar.addEventListener("click", function () {
        if (confirm("Cancelar este agendamento? O horário ficará livre novamente.")) {
          atualizarStatus("cancelado");
        }
      });
    }

  } catch (erro) {
    console.error(erro);
    tela.innerHTML = '<p class="erro">Não foi possível carregar: ' + (erro.message || "erro desconhecido") + '</p>';
  }
}

function gerarGaleria(listaFotos, tipo) {
  let html = '<div class="galeria">';

  if (listaFotos.length === 0) {
    html += '<div class="foto-box vazia">Nenhuma foto ainda</div>';
  } else {
    listaFotos.forEach(function (foto) {
      html += '<div class="foto-box" data-url="' + foto.url + '"><img src="' + foto.url + '" alt="Foto (' + tipo + ')"></div>';
    });
  }
  html += '</div>';

  if (listaFotos.length < LIMITE_FOTOS_POR_TIPO) {
    html +=
      '<label class="botao-foto" for="input-' + tipo + '">+ Adicionar foto de ' + tipo + '</label>' +
      '<input type="file" id="input-' + tipo + '" accept="image/*" capture="environment" data-tipo="' + tipo + '">';
  } else {
    html += '<p class="limite-fotos">Limite de ' + LIMITE_FOTOS_POR_TIPO + ' fotos atingido</p>';
  }

  return html;
}

function ligarCliqueNasFotos() {
  document.querySelectorAll(".foto-box[data-url]").forEach(function (box) {
    box.addEventListener("click", function () {
      abrirLightbox(box.getAttribute("data-url"));
    });
  });
}

function ligarInputsDeFoto() {
  ["antes", "depois"].forEach(function (tipo) {
    const input = document.getElementById("input-" + tipo);
    if (input) {
      input.addEventListener("change", function (evento) {
        enviarFoto(evento.target.files[0], tipo);
      });
    }
  });
}

async function enviarFoto(arquivo, tipo) {
  if (!arquivo) return;
  const label = document.querySelector('label[for="input-' + tipo + '"]');
  const mensagemErro = document.getElementById("mensagem-erro");
  mensagemErro.classList.remove("visivel");

  if (label) {
    label.classList.add("enviando");
    label.textContent = "Enviando...";
  }

  try {
    const extensao = arquivo.name.split(".").pop();
    const caminho = agendamentoId + "/" + tipo + "-" + Date.now() + "." + extensao;

    const { error: erroUpload } = await db.storage
      .from("fotos-veiculos")
      .upload(caminho, arquivo);

    if (erroUpload) throw erroUpload;

    const { data: urlPublica } = db.storage
      .from("fotos-veiculos")
      .getPublicUrl(caminho);

    const { error: erroInsert } = await db
      .from("fotos")
      .insert({
        agendamento_id: agendamentoId,
        tipo: tipo,
        url: urlPublica.publicUrl
      });

    if (erroInsert) throw erroInsert;

    carregarTela();

  } catch (erro) {
    console.error(erro);
    mensagemErro.textContent = "Não foi possível enviar a foto: " + (erro.message || "erro desconhecido");
    mensagemErro.classList.add("visivel");
    if (label) {
      label.classList.remove("enviando");
      label.textContent = "+ Adicionar foto de " + tipo;
    }
  }
}

function montarBotoesDeStatus(statusAtual) {
  const lista = document.getElementById("status-lista");

  if (statusAtual === "cancelado") {
    const aviso = document.createElement("p");
    aviso.style.fontSize = "13px";
    aviso.style.color = "var(--texto-secundario)";
    aviso.textContent = "Este agendamento foi cancelado.";
    lista.appendChild(aviso);
    return;
  }

  const posicaoAtual = ordemStatus.indexOf(statusAtual);

  ordemStatus.forEach(function (status, indice) {
    const botao = document.createElement("button");
    botao.type = "button";
    botao.textContent = rotulosStatus[status];

    if (indice < posicaoAtual) {
      botao.className = "status-botao passado";
      botao.disabled = true;
    } else if (indice === posicaoAtual) {
      botao.className = "status-botao atual";
      botao.disabled = true;
    } else {
      botao.className = "status-botao futuro";
      botao.addEventListener("click", function () {
        atualizarStatus(status);
      });
    }

    lista.appendChild(botao);
  });
}

async function atualizarStatus(novoStatus) {
  const mensagemErro = document.getElementById("mensagem-erro");
  mensagemErro.classList.remove("visivel");

  try {
    const { error } = await db
      .from("agendamentos")
      .update({ status: novoStatus })
      .eq("id", agendamentoId);

    if (error) throw error;

    carregarTela();
  } catch (erro) {
    console.error(erro);
    mensagemErro.textContent = "Não foi possível atualizar o status: " + (erro.message || "erro desconhecido");
    mensagemErro.classList.add("visivel");
  }
}

carregarTela();
</script>

</body>
</html>

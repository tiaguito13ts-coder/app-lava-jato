<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Seu agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #C9A445;
  --fundo: #0E0D0B;
  --superficie: #1B1815;
  --borda: #33302A;
  --texto: #F5F1E8;
  --texto-secundario: #A69C89;
  --texto-botao: #14130F;
  --azul-bg: #1B2C40; --azul-texto: #8FB4DC;
  --verde-bg: #23301A; --verde-texto: #A9C97D;
  --vermelho-bg: #3A1F1B; --vermelho-texto: #E0958A;
  --ambar-bg: #3A2A14; --ambar-texto: #E3B876;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--texto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 26px; }
.topo .icone-marca { width: 72px; height: auto; margin-bottom: 8px; }
.topo .nome-marca { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto); margin: 0; }
.topo .tagline-marca { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--texto-secundario); margin: 3px 0 0; }
.linha-assinatura { width: 44px; height: 2px; background: var(--dourado); margin: 12px auto 0; }
h1 { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; margin: 0 0 4px; }
p.subtitulo { font-size: 13px; color: var(--texto-secundario); margin: 0 0 14px; }

.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; margin-bottom: 18px; }
.badge.agendado { background: var(--superficie); color: var(--texto-secundario); border: 1px solid var(--borda); }
.badge.em_andamento { background: var(--azul-bg); color: var(--azul-texto); }
.badge.concluido { background: var(--verde-bg); color: var(--verde-texto); }
.badge.cancelado { background: var(--vermelho-bg); color: var(--vermelho-texto); }
.badge.disputa { background: var(--ambar-bg); color: var(--ambar-texto); }

.resumo { border: 1px solid var(--borda); border-radius: 8px; padding: 14px; font-size: 13px; background: var(--superficie); margin-bottom: 22px; }
.resumo .linha { display: flex; justify-content: space-between; padding: 5px 0; }
.resumo .linha span:first-child { color: var(--texto-secundario); }

p.rotulo-foto { font-size: 12px; color: var(--texto-secundario); margin: 14px 0 8px; font-weight: 500; }
.fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 8px; }
.foto-box {
  aspect-ratio: 1;
  background: var(--superficie);
  border: 1px solid var(--borda);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--texto-secundario);
  text-align: center;
  padding: 8px;
  cursor: pointer;
}
.foto-box img { width: 100%; height: 100%; object-fit: cover; }
.foto-box.pendente { border-style: dashed; cursor: default; }

.lightbox {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
  padding: 24px;
  cursor: zoom-out;
}
.lightbox.aberto { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

.carregando, .erro { font-size: 13px; color: var(--texto-secundario); text-align: center; padding: 40px 0; }
.erro { color: var(--vermelho-texto); }

button.secundario {
  width: 100%;
  padding: 11px;
  background: var(--superficie);
  color: var(--texto);
  border: 1px solid var(--borda);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 8px;
}
button.secundario:hover { border-color: var(--dourado); }
button.secundario:focus-visible { outline: 2px solid var(--dourado); outline-offset: 2px; }
</style>
</head>
<body>

<div class="tela" id="tela">
  <div class="topo">
    <img src="icone-carro.png" alt="" class="icone-marca">
    <p class="nome-marca">No Capricho</p>
    <p class="tagline-marca">Estética automotiva</p>
    <div class="linha-assinatura"></div>
  </div>
  <p class="carregando" id="carregando">Carregando seu agendamento...</p>
</div>

<div class="lightbox" id="lightbox">
  <img id="lightbox-img" src="" alt="Foto ampliada">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const parametros = new URLSearchParams(window.location.search);
const agendamentoId = parametros.get("agendamento_id");

const tela = document.getElementById("tela");

const cabecalhoLogo =
  '<div class="topo"><img src="icone-carro.png" alt="" class="icone-marca"><p class="nome-marca">No Capricho</p><p class="tagline-marca">Estética automotiva</p><div class="linha-assinatura"></div></div>';

const rotulosStatus = {
  agendado: "Agendado",
  em_andamento: "Em andamento",
  concluido: "Concluído",
  cancelado: "Cancelado",
  disputa: "Em análise"
};

function formatarDataHora(isoString) {
  const data = new Date(isoString);
  return data.toLocaleDateString("pt-BR") + " às " +
         data.getHours().toString().padStart(2, "0") + ":" +
         data.getMinutes().toString().padStart(2, "0");
}

function abrirLightbox(url) {
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lightbox").classList.add("aberto");
}
function fecharLightbox() {
  document.getElementById("lightbox").classList.remove("aberto");
}
document.getElementById("lightbox").addEventListener("click", fecharLightbox);

async function carregarAgendamento() {
  if (!agendamentoId) {
    tela.innerHTML = cabecalhoLogo + '<p class="erro">Agendamento não encontrado.</p>';
    return;
  }

  try {
    const { data: agendamento, error: erroAgendamento } = await db
      .from("agendamentos")
      .select("id, data_hora, status, veiculos(placa, modelo, cor)")
      .eq("id", agendamentoId)
      .single();

    if (erroAgendamento) throw erroAgendamento;

    const { data: fotos, error: erroFotos } = await db
      .from("fotos")
      .select("tipo, url")
      .eq("agendamento_id", agendamentoId)
      .order("timestamp_servidor", { ascending: true });

    if (erroFotos) throw erroFotos;

    const fotosAntes = fotos.filter(function (f) { return f.tipo === "antes"; });
    const fotosDepois = fotos.filter(function (f) { return f.tipo === "depois"; });

    const veiculo = agendamento.veiculos;
    const statusClasse = agendamento.status;
    const statusTexto = rotulosStatus[agendamento.status] || agendamento.status;

    tela.innerHTML =
      cabecalhoLogo +
      '<h1>Seu agendamento</h1>' +
      '<p class="subtitulo">' + formatarDataHora(agendamento.data_hora) + '</p>' +
      '<span class="badge ' + statusClasse + '">' + statusTexto + '</span>' +
      '<div class="resumo">' +
        '<div class="linha"><span>Veículo</span><span>' + (veiculo.modelo || "-") + ' ' + (veiculo.cor || "") + '</span></div>' +
        '<div class="linha"><span>Placa</span><span>' + veiculo.placa + '</span></div>' +
      '</div>' +
      '<p class="rotulo-foto">Fotos de antes</p>' +
      '<div class="fotos">' + gerarGaleria(fotosAntes, "antes") + '</div>' +
      '<p class="rotulo-foto">Fotos de depois</p>' +
      '<div class="fotos">' + gerarGaleria(fotosDepois, "depois") + '</div>' +
      '<button type="button" class="secundario" id="botao-atualizar">Atualizar</button>';

    document.getElementById("botao-atualizar").addEventListener("click", carregarAgendamento);
    document.querySelectorAll(".foto-box[data-url]").forEach(function (box) {
      box.addEventListener("click", function () {
        abrirLightbox(box.getAttribute("data-url"));
      });
    });

  } catch (erro) {
    console.error(erro);
    tela.innerHTML = cabecalhoLogo + '<p class="erro">Não foi possível carregar: ' + (erro.message || "erro desconhecido") + '</p>';
  }
}

function gerarGaleria(listaFotos, tipo) {
  if (listaFotos.length === 0) {
    const texto = tipo === "antes" ? "aguardando início" : "aguardando conclusão";
    return '<div class="foto-box pendente">' + texto + '</div>';
  }
  return listaFotos.map(function (foto) {
    return '<div class="foto-box" data-url="' + foto.url + '"><img src="' + foto.url + '" alt="Foto do veículo (' + tipo + ')"></div>';
  }).join("");
}

carregarAgendamento();
</script>

</body>
</html>

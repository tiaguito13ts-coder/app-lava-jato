<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Seu agendamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #B08A2E;
  --marinho: #1B3350;
  --marinho-bg: #E9EEF3;
  --preto: #16140F;
  --creme: #FAF8F4;
  --pedra: #D8D3C8;
  --texto-secundario: #6B6862;
  --branco: #FFFFFF;
  --sucesso-bg: #EEF1E4;
  --sucesso-texto: #47591F;
  --erro-bg: #FBEAE6;
  --erro-texto: #7A2E22;
  --alerta-bg: #FBF0DF;
  --alerta-texto: #8A4B12;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--creme);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--preto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 24px; }
.topo img { width: 72px; height: auto; margin-bottom: 10px; }
.linha-assinatura { width: 48px; height: 2px; background: var(--dourado); margin: 10px auto 0; }
h1 { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; margin: 0 0 4px; }
p.subtitulo { font-size: 13px; color: var(--texto-secundario); margin: 0 0 14px; }

.badge { display: inline-block; font-size: 12px; font-weight: 500; padding: 4px 12px; border-radius: 20px; margin-bottom: 18px; }
.badge.agendado { background: var(--creme); color: var(--texto-secundario); border: 1px solid var(--pedra); }
.badge.em_andamento { background: var(--marinho-bg); color: var(--marinho); }
.badge.concluido { background: var(--sucesso-bg); color: var(--sucesso-texto); }
.badge.cancelado { background: var(--erro-bg); color: var(--erro-texto); }
.badge.disputa { background: var(--alerta-bg); color: var(--alerta-texto); }

.resumo { border: 1px solid var(--pedra); border-radius: 8px; padding: 14px; font-size: 13px; background: var(--branco); margin-bottom: 22px; }
.resumo .linha { display: flex; justify-content: space-between; padding: 5px 0; }
.resumo .linha span:first-child { color: var(--texto-secundario); }

p.rotulo-foto { font-size: 12px; color: var(--texto-secundario); margin: 0 0 8px; font-weight: 500; }
.fotos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 8px; }
.foto-box {
  aspect-ratio: 1;
  background: var(--branco);
  border: 1px solid var(--pedra);
  border-radius: 8px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--texto-secundario);
  text-align: center;
  padding: 8px;
}
.foto-box img { width: 100%; height: 100%; object-fit: cover; }
.foto-box.pendente { border-style: dashed; }

.carregando, .erro { font-size: 13px; color: var(--texto-secundario); text-align: center; padding: 40px 0; }
.erro { color: var(--erro-texto); }

button.secundario {
  width: 100%;
  padding: 11px;
  background: var(--branco);
  color: var(--preto);
  border: 1px solid var(--pedra);
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 8px;
}
button.secundario:hover { border-color: var(--dourado); }
button.secundario:focus-visible { outline: 2px solid var(--marinho); outline-offset: 2px; }
</style>
</head>
<body>

<div class="tela" id="tela">
  <div class="topo">
    <img src="logo.png" alt="No Capricho — Estética Automotiva">
    <div class="linha-assinatura"></div>
  </div>
  <p class="carregando" id="carregando">Carregando seu agendamento...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const parametros = new URLSearchParams(window.location.search);
const agendamentoId = parametros.get("agendamento_id");

const tela = document.getElementById("tela");

const cabecalhoLogo =
  '<div class="topo"><img src="logo.png" alt="No Capricho — Estética Automotiva"><div class="linha-assinatura"></div></div>';

const rotulosStatus = {
  agendado: "Agendado",
  em_andamento: "Em andamento",
  concluido: "Concluído",
  cancelado: "Cancelado",
  disputa: "Em análise"
};

function formatarDataHora(isoString) {
  const data = new Date(isoString);
  return data.toLocaleDateString("pt-BR") + " às " +
         data.getHours().toString().padStart(2, "0") + ":" +
         data.getMinutes().toString().padStart(2, "0");
}

async function carregarAgendamento() {
  if (!agendamentoId) {
    tela.innerHTML = cabecalhoLogo + '<p class="erro">Agendamento não encontrado.</p>';
    return;
  }

  try {
    const { data: agendamento, error: erroAgendamento } = await db
      .from("agendamentos")
      .select("id, data_hora, status, veiculos(placa, modelo, cor)")
      .eq("id", agendamentoId)
      .single();

    if (erroAgendamento) throw erroAgendamento;

    const { data: fotos, error: erroFotos } = await db
      .from("fotos")
      .select("tipo, url")
      .eq("agendamento_id", agendamentoId);

    if (erroFotos) throw erroFotos;

    const fotoAntes = fotos.find(function (f) { return f.tipo === "antes"; });
    const fotoDepois = fotos.find(function (f) { return f.tipo === "depois"; });

    const veiculo = agendamento.veiculos;
    const statusClasse = agendamento.status;
    const statusTexto = rotulosStatus[agendamento.status] || agendamento.status;

    tela.innerHTML =
      cabecalhoLogo +
      '<h1>Seu agendamento</h1>' +
      '<p class="subtitulo">' + formatarDataHora(agendamento.data_hora) + '</p>' +
      '<span class="badge ' + statusClasse + '">' + statusTexto + '</span>' +
      '<div class="resumo">' +
        '<div class="linha"><span>Veículo</span><span>' + (veiculo.modelo || "-") + ' ' + (veiculo.cor || "") + '</span></div>' +
        '<div class="linha"><span>Placa</span><span>' + veiculo.placa + '</span></div>' +
      '</div>' +
      '<p class="rotulo-foto">Fotos do veículo</p>' +
      '<div class="fotos">' +
        gerarBlocoFoto(fotoAntes, "antes") +
        gerarBlocoFoto(fotoDepois, "depois") +
      '</div>' +
      '<button type="button" class="secundario" id="botao-atualizar">Atualizar</button>';

    document.getElementById("botao-atualizar").addEventListener("click", carregarAgendamento);

  } catch (erro) {
    console.error(erro);
    tela.innerHTML = cabecalhoLogo + '<p class="erro">Não foi possível carregar: ' + (erro.message || "erro desconhecido") + '</p>';
  }
}

function gerarBlocoFoto(foto, tipo) {
  if (foto) {
    return '<div class="foto-box"><img src="' + foto.url + '" alt="Foto do veículo (' + tipo + ')"></div>';
  }
  const texto = tipo === "antes" ? "aguardando início" : "aguardando conclusão";
  return '<div class="foto-box pendente">' + texto + '</div>';
}

carregarAgendamento();
</script>

</body>
</html>

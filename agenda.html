<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Agenda do dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #C9A445;
  --fundo: #0E0D0B;
  --superficie: #1B1815;
  --borda: #33302A;
  --texto: #F5F1E8;
  --texto-secundario: #A69C89;
  --azul-bg: #1B2C40; --azul-texto: #8FB4DC;
  --verde-bg: #23301A; --verde-texto: #A9C97D;
  --vermelho-bg: #3A1F1B; --vermelho-texto: #E0958A;
  --ambar-bg: #3A2A14; --ambar-texto: #E3B876;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--texto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 26px; }
.topo .icone-marca { width: 72px; height: auto; margin-bottom: 8px; }
.topo .nome-marca { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto); margin: 0; }
.topo .tagline-marca { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--texto-secundario); margin: 3px 0 0; }
.linha-assinatura { width: 44px; height: 2px; background: var(--dourado); margin: 12px auto 0; }
h1 { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; margin: 0 0 4px; }
p.hint { font-size: 13px; color: var(--texto-secundario); margin: 0 0 16px; }

.nav-data { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
input[type="date"] {
  flex: 1;
  padding: 11px 12px;
  border: 1px solid var(--borda);
  border-radius: 6px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: var(--superficie);
  color: var(--texto);
  color-scheme: dark;
}
input:focus { outline: none; border-color: var(--dourado); box-shadow: 0 0 0 3px rgba(201, 164, 69, 0.18); }
.seta {
  padding: 11px 14px;
  border: 1px solid var(--borda);
  border-radius: 6px;
  background: var(--superficie);
  color: var(--texto);
  font-size: 14px;
  cursor: pointer;
}
.seta:hover { border-color: var(--dourado); }
.botao-hoje {
  padding: 10px 12px;
  border: 1px solid var(--borda);
  border-radius: 6px;
  background: var(--superficie);
  font-size: 12px;
  font-family: 'Inter', sans-serif;
  color: var(--texto-secundario);
  cursor: pointer;
  margin-bottom: 18px;
  width: 100%;
}
.botao-hoje:hover { border-color: var(--dourado); }

.item {
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 13px;
  margin-bottom: 8px;
  background: var(--superficie);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  text-decoration: none;
  color: inherit;
}
.item.em_andamento { border: 2px solid var(--azul-texto); background: var(--azul-bg); }
.item .info p { margin: 0; }
.item .horario { font-size: 13px; font-weight: 600; color: var(--texto); }
.item.em_andamento .horario { color: var(--azul-texto); }
.item .cliente { font-size: 11px; color: var(--texto-secundario); margin-top: 2px; }
.item.em_andamento .cliente { color: var(--azul-texto); opacity: 0.85; }

.badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
.badge.agendado { background: var(--fundo); color: var(--texto-secundario); }
.badge.em_andamento { background: var(--superficie); color: var(--azul-texto); }
.badge.concluido { background: var(--verde-bg); color: var(--verde-texto); }
.badge.cancelado { background: var(--vermelho-bg); color: var(--vermelho-texto); }
.badge.disputa { background: var(--ambar-bg); color: var(--ambar-texto); }

.carregando, .vazio, .erro { font-size: 13px; color: var(--texto-secundario); text-align: center; padding: 30px 0; }
.erro { color: var(--vermelho-texto); }

.quadro-futuros {
  width: 100%;
  background: var(--superficie);
  border: 1px solid var(--dourado);
  border-radius: 10px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  overflow: hidden;
  margin-bottom: 20px;
}
.cabecalho-futuros {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 12px;
  background: var(--dourado-bg, #2A2415);
  border: none;
  border-bottom: 1px solid var(--borda);
  color: var(--dourado);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.03em;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
}
.lista-futuros { padding: 8px; max-height: 320px; overflow-y: auto; }
.lista-futuros.oculto { display: none; }
.item-futuro {
  display: block;
  border: 1px solid var(--borda);
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 6px;
  background: var(--fundo);
  text-decoration: none;
  color: inherit;
}
.item-futuro:last-child { margin-bottom: 0; }
.item-futuro:hover { border-color: var(--dourado); }
.item-futuro .linha1 { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; gap: 6px; }
.item-futuro .linha2 { font-size: 10px; color: var(--texto-secundario); margin-top: 2px; }

.quadro-bloqueio { width: 100%; background: var(--superficie); border: 1px solid var(--vermelho-texto); border-radius: 10px; overflow: hidden; margin-bottom: 18px; }
.cabecalho-bloqueio {
  width: 100%; display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--vermelho-bg); border: none; border-bottom: 1px solid var(--borda);
  color: var(--vermelho-texto); font-size: 12px; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer;
}
.corpo-bloqueio { padding: 12px; }
.corpo-bloqueio.oculto { display: none; }
.corpo-bloqueio label { font-size: 11px; color: var(--texto-secundario); display: block; margin-bottom: 4px; }
.corpo-bloqueio input { width: 100%; padding: 9px 10px; margin-bottom: 10px; border: 1px solid var(--borda); border-radius: 6px; font-size: 13px; background: var(--fundo); color: var(--texto); color-scheme: dark; }
.primario-bloqueio { width: 100%; padding: 10px; background: var(--vermelho-texto); color: var(--fundo); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
.primario-bloqueio:disabled { opacity: 0.5; cursor: default; }
.item-bloqueado { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 8px 0; border-top: 1px solid var(--borda); margin-top: 8px; }
.item-bloqueado button { background: none; border: none; color: var(--texto-secundario); font-size: 11px; cursor: pointer; text-decoration: underline; }
.mensagem-erro { font-size: 12px; color: var(--vermelho-texto); background: var(--vermelho-bg); padding: 8px 10px; border-radius: 6px; margin: 8px 0 0; display: none; }
.mensagem-erro.visivel { display: block; }
</style>
</head>
<body>

<div class="tela">
  <div class="topo">
    <img src="icone-carro.png" alt="" class="icone-marca">
    <p class="nome-marca">No Capricho</p>
    <p class="tagline-marca">Estética automotiva</p>
    <div class="linha-assinatura"></div>
  </div>

  <h1>Agenda do dia</h1>
  <div class="nav-data">
    <button type="button" class="seta" id="botao-anterior">&larr;</button>
    <input type="date" id="data">
    <button type="button" class="seta" id="botao-proximo">&rarr;</button>
  </div>
  <button type="button" class="botao-hoje" id="botao-hoje">Ir para hoje</button>

  <div class="quadro-futuros">
    <button type="button" class="cabecalho-futuros" id="botao-futuros">
      <span>📋 Próximos agendamentos</span>
      <span id="seta-futuros">▴</span>
    </button>
    <div id="lista-futuros" class="lista-futuros"></div>
  </div>

  <div class="quadro-bloqueio">
    <button type="button" class="cabecalho-bloqueio" id="botao-bloqueio">
      <span>🚫 Bloquear um dia</span>
      <span id="seta-bloqueio">▾</span>
    </button>
    <div id="corpo-bloqueio" class="corpo-bloqueio oculto">
      <label for="data-bloqueio">Data a bloquear</label>
      <input type="date" id="data-bloqueio">
      <label for="motivo-bloqueio">Motivo (aparece pro cliente)</label>
      <input type="text" id="motivo-bloqueio" placeholder="Ex: imprevisto pessoal">
      <button type="button" class="primario-bloqueio" id="botao-confirmar-bloqueio">Bloquear este dia</button>
      <p class="mensagem-erro" id="erro-bloqueio"></p>
      <div id="lista-bloqueios"></div>
    </div>
  </div>

  <div id="lista"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const inputData = document.getElementById("data");
const lista = document.getElementById("lista");

const rotulosStatus = {
  agendado: "Agendado",
  em_andamento: "Em andamento",
  concluido: "Concluído",
  cancelado: "Cancelado",
  disputa: "Em análise"
};

const DATA_REFERENCIA_FOLGA = new Date("2026-07-31T00:00:00");

function ehDiaDeTrabalho(dataString) {
  const data = new Date(dataString + "T00:00:00");
  const diferencaEmDias = Math.round((data - DATA_REFERENCIA_FOLGA) / (1000 * 60 * 60 * 24));
  const resto = ((diferencaEmDias % 2) + 2) % 2;
  return resto === 1;
}

function formatarData(dataObj) {
  return dataObj.toISOString().split("T")[0];
}

function proximoDiaDeTrabalho(dataInicial) {
  const data = new Date(dataInicial);
  while (!ehDiaDeTrabalho(formatarData(data))) {
    data.setDate(data.getDate() + 1);
  }
  return data;
}

function diaDeTrabalhoAnterior(dataInicial) {
  const data = new Date(dataInicial);
  do {
    data.setDate(data.getDate() - 1);
  } while (!ehDiaDeTrabalho(formatarData(data)));
  return data;
}

inputData.value = formatarData(proximoDiaDeTrabalho(new Date()));

// ============================================================
// Quadro "Agendamentos futuros" — mostra os próximos agendamentos
// ativos de qualquer dia futuro, sem precisar navegar na agenda.
// ============================================================
const listaFuturos = document.getElementById("lista-futuros");
const botaoFuturos = document.getElementById("botao-futuros");
const setaFuturos = document.getElementById("seta-futuros");

botaoFuturos.addEventListener("click", function () {
  const estaOculto = listaFuturos.classList.toggle("oculto");
  setaFuturos.textContent = estaOculto ? "▾" : "▴";
});

carregarAgendamentosFuturos();

// ============================================================
// Bloqueio de dias (imprevistos)
// ============================================================
const botaoBloqueio = document.getElementById("botao-bloqueio");
const corpoBloqueio = document.getElementById("corpo-bloqueio");
const setaBloqueio = document.getElementById("seta-bloqueio");
const inputDataBloqueio = document.getElementById("data-bloqueio");
const inputMotivoBloqueio = document.getElementById("motivo-bloqueio");
const botaoConfirmarBloqueio = document.getElementById("botao-confirmar-bloqueio");
const erroBloqueio = document.getElementById("erro-bloqueio");
const listaBloqueios = document.getElementById("lista-bloqueios");

botaoBloqueio.addEventListener("click", function () {
  const oculto = corpoBloqueio.classList.toggle("oculto");
  setaBloqueio.textContent = oculto ? "▾" : "▴";
  if (!oculto) carregarListaBloqueios();
});

async function carregarListaBloqueios() {
  listaBloqueios.innerHTML = '<p class="carregando">Carregando...</p>';
  try {
    const hoje = formatarData(new Date());
    const { data, error } = await db
      .from("bloqueios")
      .select("id, data, motivo")
      .gte("data", hoje)
      .order("data", { ascending: true });

    if (error) throw error;

    if (data.length === 0) {
      listaBloqueios.innerHTML = '<p class="carregando">Nenhum dia bloqueado no momento.</p>';
      return;
    }

    listaBloqueios.innerHTML = "";
    data.forEach(function (bloqueio) {
      const dataFormatada = new Date(bloqueio.data + "T00:00:00").toLocaleDateString("pt-BR");
      const item = document.createElement("div");
      item.className = "item-bloqueado";
      item.innerHTML =
        '<span>' + dataFormatada + (bloqueio.motivo ? " · " + bloqueio.motivo : "") + '</span>' +
        '<button type="button" data-id="' + bloqueio.id + '">desbloquear</button>';
      item.querySelector("button").addEventListener("click", function () {
        desbloquearDia(bloqueio.id);
      });
      listaBloqueios.appendChild(item);
    });
  } catch (erro) {
    console.error(erro);
    listaBloqueios.innerHTML = '<p class="carregando">Erro ao carregar bloqueios.</p>';
  }
}

async function desbloquearDia(id) {
  try {
    const { error } = await db.from("bloqueios").delete().eq("id", id);
    if (error) throw error;
    carregarListaBloqueios();
  } catch (erro) {
    console.error(erro);
  }
}

botaoConfirmarBloqueio.addEventListener("click", async function () {
  erroBloqueio.classList.remove("visivel");
  const data = inputDataBloqueio.value;
  const motivo = inputMotivoBloqueio.value.trim();

  if (!data) {
    erroBloqueio.textContent = "Escolha uma data.";
    erroBloqueio.classList.add("visivel");
    return;
  }

  botaoConfirmarBloqueio.disabled = true;
  botaoConfirmarBloqueio.textContent = "Bloqueando...";

  try {
    const { error } = await db.from("bloqueios").insert({ data: data, motivo: motivo || null });
    if (error) throw error;

    inputDataBloqueio.value = "";
    inputMotivoBloqueio.value = "";
    carregarListaBloqueios();
  } catch (erro) {
    console.error(erro);
    erroBloqueio.textContent = erro.code === "23505"
      ? "Esse dia já está bloqueado."
      : "Não foi possível bloquear: " + (erro.message || "erro desconhecido");
    erroBloqueio.classList.add("visivel");
  } finally {
    botaoConfirmarBloqueio.disabled = false;
    botaoConfirmarBloqueio.textContent = "Bloquear este dia";
  }
});

async function carregarAgendamentosFuturos() {
  listaFuturos.innerHTML = '<p class="carregando">Carregando...</p>';

  try {
    const agora = new Date().toISOString();
    const { data: agendamentos, error } = await db
      .from("agendamentos")
      .select("id, data_hora, status, clientes(nome), veiculos(placa, modelo)")
      .gte("data_hora", agora)
      .neq("status", "cancelado")
      .order("data_hora", { ascending: true })
      .limit(15);

    if (error) throw error;

    futurosJaCarregados = true;

    if (agendamentos.length === 0) {
      listaFuturos.innerHTML = '<p class="vazio">Nenhum agendamento futuro.</p>';
      return;
    }

    listaFuturos.innerHTML = "";
    agendamentos.forEach(function (ag) {
      const dataObj = new Date(ag.data_hora);
      const dataFormatada = dataObj.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
      const horaFormatada = dataObj.getHours().toString().padStart(2, "0") + ":" +
                             dataObj.getMinutes().toString().padStart(2, "0");
      const veiculo = ag.veiculos;
      const cliente = ag.clientes;
      const statusTexto = rotulosStatus[ag.status] || ag.status;

      const link = document.createElement("a");
      link.href = "agendamento.html?id=" + ag.id;
      link.className = "item-futuro";
      link.innerHTML =
        '<div class="linha1"><span>' + dataFormatada + ' às ' + horaFormatada + '</span><span>' + statusTexto + '</span></div>' +
        '<div class="linha2">' + cliente.nome + ' · ' + (veiculo.modelo || veiculo.placa) + '</div>';

      listaFuturos.appendChild(link);
    });

  } catch (erro) {
    console.error(erro);
    listaFuturos.innerHTML = '<p class="erro">Erro ao carregar.</p>';
  }
}

async function carregarAgenda() {
  const dataEscolhida = inputData.value;

  if (!ehDiaDeTrabalho(dataEscolhida)) {
    lista.innerHTML = '<p class="vazio">Dia de folga — o lava-rápido não funciona nesse dia.</p>';
    return;
  }

  lista.innerHTML = '<p class="carregando">Carregando agenda...</p>';

  const inicioDoDia = dataEscolhida + "T00:00:00-03:00";
  const fimDoDia = dataEscolhida + "T23:59:59-03:00";

  try {
    const { data: agendamentos, error } = await db
      .from("agendamentos")
      .select("id, data_hora, status, clientes(nome, telefone), veiculos(placa, modelo, cor)")
      .gte("data_hora", inicioDoDia)
      .lte("data_hora", fimDoDia)
      .order("data_hora", { ascending: true });

    if (error) throw error;

    if (agendamentos.length === 0) {
      lista.innerHTML = '<p class="vazio">Nenhum agendamento para esse dia.</p>';
      return;
    }

    lista.innerHTML = "";
    agendamentos.forEach(function (agendamento) {
      const dataObj = new Date(agendamento.data_hora);
      const horario = dataObj.getHours().toString().padStart(2, "0") + ":" +
                       dataObj.getMinutes().toString().padStart(2, "0");
      const veiculo = agendamento.veiculos;
      const cliente = agendamento.clientes;
      const statusTexto = rotulosStatus[agendamento.status] || agendamento.status;

      const link = document.createElement("a");
      link.href = "agendamento.html?id=" + agendamento.id;
      link.className = "item" + (agendamento.status === "em_andamento" ? " em_andamento" : "");
      link.innerHTML =
        '<div class="info">' +
          '<p class="horario">' + horario + ' · ' + (veiculo.modelo || veiculo.placa) + '</p>' +
          '<p class="cliente">' + cliente.nome + '</p>' +
        '</div>' +
        '<span class="badge ' + agendamento.status + '">' + statusTexto + '</span>';

      lista.appendChild(link);
    });

  } catch (erro) {
    console.error(erro);
    lista.innerHTML = '<p class="erro">Não foi possível carregar: ' + (erro.message || "erro desconhecido") + '</p>';
  }
}

document.getElementById("botao-anterior").addEventListener("click", function () {
  const dataAtual = new Date(inputData.value + "T00:00:00");
  inputData.value = formatarData(diaDeTrabalhoAnterior(dataAtual));
  carregarAgenda();
});
document.getElementById("botao-proximo").addEventListener("click", function () {
  const dataAtual = new Date(inputData.value + "T00:00:00");
  dataAtual.setDate(dataAtual.getDate() + 1);
  inputData.value = formatarData(proximoDiaDeTrabalho(dataAtual));
  carregarAgenda();
});
document.getElementById("botao-hoje").addEventListener("click", function () {
  inputData.value = formatarData(proximoDiaDeTrabalho(new Date()));
  carregarAgenda();
});

inputData.addEventListener("change", carregarAgenda);
carregarAgenda();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Escolher horário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #C9A445;
  --dourado-escuro: #B08A2E;
  --dourado-bg: #2A2415;
  --fundo: #0E0D0B;
  --superficie: #1B1815;
  --borda: #33302A;
  --texto: #F5F1E8;
  --texto-secundario: #A69C89;
  --texto-botao: #14130F;
  --erro-bg: #3A1F1B;
  --erro-texto: #E0958A;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--texto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 26px; }
.topo .icone-marca { width: 72px; height: auto; margin-bottom: 8px; }
.topo .nome-marca { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto); margin: 0; }
.topo .tagline-marca { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--texto-secundario); margin: 3px 0 0; }
.linha-assinatura { width: 44px; height: 2px; background: var(--dourado); margin: 12px auto 0; }
h1 { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; margin: 0 0 4px; }
p.hint { font-size: 13px; color: var(--texto-secundario); margin: 0 0 16px; }
label { font-size: 12px; color: var(--texto-secundario); display: block; margin-bottom: 4px; font-weight: 500; }
input[type="date"] {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 18px;
  border: 1px solid var(--borda);
  border-radius: 6px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: var(--superficie);
  color: var(--texto);
  color-scheme: dark;
}
input:focus { outline: none; border-color: var(--dourado); box-shadow: 0 0 0 3px rgba(201, 164, 69, 0.18); }
.slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.slot {
  font-size: 14px;
  font-weight: 500;
  padding: 18px 0;
  border-radius: 6px;
  border: 1px solid var(--borda);
  background: var(--superficie);
  color: var(--texto);
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s;
}
.slot.ocupado { background: #17150F; color: var(--texto-secundario); border-color: #17150F; cursor: default; }
.slot.selecionado { border: 2px solid var(--dourado); background: var(--dourado-bg); color: var(--dourado); font-weight: 600; }
.carregando, .vazio { font-size: 13px; color: var(--texto-secundario); text-align: center; padding: 24px 0; }
button.primario {
  width: 100%;
  padding: 13px;
  background: var(--dourado);
  color: var(--texto-botao);
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background 0.15s;
}
button.primario:hover:not(:disabled) { background: #DDB65A; }
button.primario:disabled { background: var(--borda); color: var(--texto-secundario); cursor: default; }
button.primario:focus-visible { outline: 2px solid var(--dourado); outline-offset: 2px; }
.mensagem-erro { font-size: 12px; color: var(--erro-texto); background: var(--erro-bg); padding: 8px 10px; border-radius: 6px; margin: -6px 0 14px; display: none; }
.mensagem-erro.visivel { display: block; }
</style>
</head>
<body>

<div class="tela">
  <div class="topo">
    <img src="icone-carro.png" alt="" class="icone-marca">
    <p class="nome-marca">No Capricho</p>
    <p class="tagline-marca">Estética automotiva</p>
    <div class="linha-assinatura"></div>
  </div>

  <h1>Escolha o horário</h1>
  <p class="hint">O lava-rápido funciona em dias alternados</p>

  <label for="data">Data</label>
  <input type="date" id="data">

  <div id="area-horarios">
    <p class="carregando">Carregando horários...</p>
  </div>

  <p class="mensagem-erro" id="mensagem-erro"></p>

  <button type="button" class="primario" id="botao-confirmar" disabled>Confirmar horário</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const parametros = new URLSearchParams(window.location.search);
const clienteId = parametros.get("cliente_id");
const veiculoId = parametros.get("veiculo_id");

if (!clienteId || !veiculoId) {
  window.location.href = "index.html";
}

const inputData = document.getElementById("data");
const areaHorarios = document.getElementById("area-horarios");
const botaoConfirmar = document.getElementById("botao-confirmar");
const mensagemErro = document.getElementById("mensagem-erro");

let horarioSelecionado = null;

function mostrarErro(texto) {
  mensagemErro.textContent = texto;
  mensagemErro.classList.add("visivel");
}
function limparErro() {
  mensagemErro.classList.remove("visivel");
}

const DATA_REFERENCIA_FOLGA = new Date("2026-07-31T00:00:00");

function ehDiaDeTrabalho(dataString) {
  const data = new Date(dataString + "T00:00:00");
  const diferencaEmDias = Math.round((data - DATA_REFERENCIA_FOLGA) / (1000 * 60 * 60 * 24));
  const resto = ((diferencaEmDias % 2) + 2) % 2;
  return resto === 1;
}

function formatarData(dataObj) {
  return dataObj.toISOString().split("T")[0];
}

function proximoDiaDeTrabalho(dataInicial) {
  const data = new Date(dataInicial);
  while (!ehDiaDeTrabalho(formatarData(data))) {
    data.setDate(data.getDate() + 1);
  }
  return data;
}

const amanha = new Date();
amanha.setDate(amanha.getDate() + 1);
inputData.value = formatarData(proximoDiaDeTrabalho(amanha));

function gerarGradeDeHorarios() {
  return ["08:00", "12:00"];
}

async function buscarHorariosOcupados(dataEscolhida) {
  const inicioDoDia = dataEscolhida + "T00:00:00";
  const fimDoDia = dataEscolhida + "T23:59:59";

  const { data, error } = await db
    .from("agendamentos")
    .select("data_hora")
    .gte("data_hora", inicioDoDia)
    .lte("data_hora", fimDoDia)
    .neq("status", "cancelado");

  if (error) throw error;

  return data.map(function (linha) {
    const dataObj = new Date(linha.data_hora);
    return dataObj.getHours().toString().padStart(2, "0") + ":" +
           dataObj.getMinutes().toString().padStart(2, "0");
  });
}

async function renderizarHorarios() {
  limparErro();
  horarioSelecionado = null;
  botaoConfirmar.disabled = true;

  const dataEscolhida = inputData.value;
  if (!dataEscolhida) return;

  if (!ehDiaDeTrabalho(dataEscolhida)) {
    areaHorarios.innerHTML = '<p class="vazio">O lava-rápido não funciona nesse dia (dia de folga). Escolha outra data.</p>';
    return;
  }

  areaHorarios.innerHTML = '<p class="carregando">Carregando horários...</p>';

  try {
    const ocupados = await buscarHorariosOcupados(dataEscolhida);
    const todosHorarios = gerarGradeDeHorarios();

    areaHorarios.innerHTML = "";
    const grade = document.createElement("div");
    grade.className = "slots";

    todosHorarios.forEach(function (horario) {
      const horaInicio = parseInt(horario.split(":")[0], 10);
      const horaFim = horaInicio + 4;
      const rotulo = horario + " - " + horaFim.toString().padStart(2, "0") + ":00";

      const botao = document.createElement("div");
      botao.textContent = rotulo;
      botao.className = "slot";

      if (ocupados.includes(horario)) {
        botao.classList.add("ocupado");
        botao.addEventListener("click", function () {
          mostrarErro("Esse horário já está ocupado. Escolha outro.");
        });
      } else {
        botao.addEventListener("click", function () {
          limparErro();
          grade.querySelectorAll(".slot.selecionado").forEach(function (el) {
            el.classList.remove("selecionado");
          });
          botao.classList.add("selecionado");
          horarioSelecionado = dataEscolhida + "T" + horario + ":00";
          botaoConfirmar.disabled = false;
        });
      }

      grade.appendChild(botao);
    });

    areaHorarios.appendChild(grade);

  } catch (erro) {
    console.error(erro);
    areaHorarios.innerHTML = "";
    mostrarErro("Não foi possível carregar os horários: " + (erro.message || "erro desconhecido"));
  }
}

inputData.addEventListener("change", renderizarHorarios);

botaoConfirmar.addEventListener("click", async function () {
  if (!horarioSelecionado) return;

  limparErro();
  botaoConfirmar.disabled = true;
  botaoConfirmar.textContent = "Confirmando...";

  try {
    const { data: novoAgendamento, error } = await db
      .from("agendamentos")
      .insert({
        cliente_id: clienteId,
        veiculo_id: veiculoId,
        data_hora: horarioSelecionado
      })
      .select("id")
      .single();

    if (error) {
      if (error.code === "23505") {
        await renderizarHorarios();
        mostrarErro("Esse horário acabou de ser reservado por outra pessoa. Escolha outro.");
        return;
      }
      throw error;
    }

    window.location.href = "status.html?agendamento_id=" + novoAgendamento.id;

  } catch (erro) {
    console.error(erro);
    mostrarErro("Não foi possível confirmar: " + (erro.message || "erro desconhecido"));
  } finally {
    botaoConfirmar.disabled = false;
    botaoConfirmar.textContent = "Confirmar horário";
  }
});

renderizarHorarios();
</script>

</body>
</html>

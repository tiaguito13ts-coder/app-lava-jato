<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Escolher horário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #C9A445;
  --dourado-escuro: #B08A2E;
  --dourado-bg: #2A2415;
  --fundo: #0E0D0B;
  --superficie: #1B1815;
  --borda: #33302A;
  --texto: #F5F1E8;
  --texto-secundario: #A69C89;
  --texto-botao: #14130F;
  --erro-bg: #3A1F1B;
  --erro-texto: #E0958A;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--texto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 26px; }
.topo .icone-marca { width: 72px; height: auto; margin-bottom: 8px; }
.topo .nome-marca { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--texto); margin: 0; }
.topo .tagline-marca { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--texto-secundario); margin: 3px 0 0; }
.linha-assinatura { width: 44px; height: 2px; background: var(--dourado); margin: 12px auto 0; }
h1 { font-family: 'Playfair Display', serif; font-size: 19px; font-weight: 700; margin: 0 0 4px; }
p.hint { font-size: 13px; color: var(--texto-secundario); margin: 0 0 18px; }

.dia-card {
  border: 1px solid var(--borda);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  background: var(--superficie);
}
.dia-card .dia-titulo {
  font-size: 13px;
  font-weight: 600;
  margin: 0 0 8px;
  text-transform: capitalize;
}
.dia-card .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.slot {
  font-size: 13px;
  font-weight: 500;
  padding: 12px 0;
  border-radius: 6px;
  border: 1px solid var(--borda);
  background: var(--fundo);
  color: var(--texto);
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s;
}
.slot.selecionado { border: 2px solid var(--dourado); background: var(--dourado-bg); color: var(--dourado); font-weight: 600; }

.carregando, .vazio { font-size: 13px; color: var(--texto-secundario); text-align: center; padding: 24px 0; }
button.primario {
  width: 100%;
  padding: 13px;
  background: var(--dourado);
  color: var(--texto-botao);
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  transition: background 0.15s;
  margin-top: 4px;
}
button.primario:hover:not(:disabled) { background: #DDB65A; }
button.primario:disabled { background: var(--borda); color: var(--texto-secundario); cursor: default; }
button.primario:focus-visible { outline: 2px solid var(--dourado); outline-offset: 2px; }
.mensagem-erro { font-size: 12px; color: var(--erro-texto); background: var(--erro-bg); padding: 8px 10px; border-radius: 6px; margin: 0 0 14px; display: none; }
.mensagem-erro.visivel { display: block; }
</style>
</head>
<body>

<div class="tela">
  <div class="topo">
    <img src="icone-carro.png" alt="" class="icone-marca">
    <p class="nome-marca">No Capricho</p>
    <p class="tagline-marca">Estética automotiva</p>
    <div class="linha-assinatura"></div>
  </div>

  <h1>Escolha o horário</h1>
  <p class="hint">Próximos dias com vaga disponível</p>

  <div id="area-dias">
    <p class="carregando">Carregando horários...</p>
  </div>

  <p class="mensagem-erro" id="mensagem-erro"></p>

  <button type="button" class="primario" id="botao-confirmar" disabled>Confirmar horário</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const parametros = new URLSearchParams(window.location.search);
const clienteId = parametros.get("cliente_id");
const veiculoId = parametros.get("veiculo_id");

if (!clienteId || !veiculoId) {
  window.location.href = "index.html";
}

const areaDias = document.getElementById("area-dias");
const botaoConfirmar = document.getElementById("botao-confirmar");
const mensagemErro = document.getElementById("mensagem-erro");

let horarioSelecionado = null;

function mostrarErro(texto) {
  mensagemErro.textContent = texto;
  mensagemErro.classList.add("visivel");
}
function limparErro() {
  mensagemErro.classList.remove("visivel");
}

// ============================================================
// Escala 12/36: dias de trabalho alternados
// 31/07/2026 é um dia de FOLGA confirmado (ele está no posto fixo
// nesse dia) — usamos essa data como referência confiável.
// ============================================================
const DATA_REFERENCIA_FOLGA = new Date("2026-07-31T00:00:00");

function ehDiaDeTrabalho(dataString) {
  const data = new Date(dataString + "T00:00:00");
  const diferencaEmDias = Math.round((data - DATA_REFERENCIA_FOLGA) / (1000 * 60 * 60 * 24));
  const resto = ((diferencaEmDias % 2) + 2) % 2;
  return resto === 1;
}

function formatarData(dataObj) {
  return dataObj.toISOString().split("T")[0];
}

function formatarRotuloDia(dataString) {
  const data = new Date(dataString + "T00:00:00");
  const rotulo = data.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
  return rotulo;
}

const GRADE_HORARIOS = ["08:00", "12:00"];
const QUANTIDADE_DIAS_COM_VAGA = 6;   // quantos dias com vaga livre mostrar
const LIMITE_DIAS_VARRIDOS = 40;      // segurança pra não escanear pra sempre

async function carregarProximosDiasComVaga() {
  limparErro();
  areaDias.innerHTML = '<p class="carregando">Carregando horários...</p>';
  botaoConfirmar.disabled = true;
  horarioSelecionado = null;

  // Monta a lista de dias de trabalho candidatos, a partir de amanhã
  const diasCandidatos = [];
  const cursor = new Date();
  cursor.setDate(cursor.getDate() + 1);
  for (let i = 0; i < LIMITE_DIAS_VARRIDOS && diasCandidatos.length < 20; i++) {
    const dataStr = formatarData(cursor);
    if (ehDiaDeTrabalho(dataStr)) diasCandidatos.push(dataStr);
    cursor.setDate(cursor.getDate() + 1);
  }

  if (diasCandidatos.length === 0) {
    areaDias.innerHTML = '<p class="vazio">Não foi possível carregar os próximos dias de trabalho.</p>';
    return;
  }

  const inicio = diasCandidatos[0] + "T00:00:00";
  const fim = diasCandidatos[diasCandidatos.length - 1] + "T23:59:59";

  try {
    const { data, error } = await db
      .from("agendamentos")
      .select("data_hora")
      .gte("data_hora", inicio)
      .lte("data_hora", fim)
      .neq("status", "cancelado");

    if (error) throw error;

    // Agrupa horários ocupados por data (ex: "2026-08-02": ["08:00"])
    const ocupadosPorDia = {};
    data.forEach(function (linha) {
      const dataObj = new Date(linha.data_hora);
      const dataStr = formatarData(dataObj);
      const horaStr = dataObj.getHours().toString().padStart(2, "0") + ":" +
                       dataObj.getMinutes().toString().padStart(2, "0");
      if (!ocupadosPorDia[dataStr]) ocupadosPorDia[dataStr] = [];
      ocupadosPorDia[dataStr].push(horaStr);
    });

    // Filtra só os dias que têm pelo menos 1 horário livre
    const diasComVaga = diasCandidatos
      .map(function (dataStr) {
        const ocupados = ocupadosPorDia[dataStr] || [];
        const disponiveis = GRADE_HORARIOS.filter(function (h) {
          return !ocupados.includes(h);
        });
        return { data: dataStr, disponiveis: disponiveis };
      })
      .filter(function (dia) { return dia.disponiveis.length > 0; })
      .slice(0, QUANTIDADE_DIAS_COM_VAGA);

    if (diasComVaga.length === 0) {
      areaDias.innerHTML = '<p class="vazio">Nenhum horário disponível nos próximos dias. Tente novamente mais tarde.</p>';
      return;
    }

    areaDias.innerHTML = "";
    diasComVaga.forEach(function (dia) {
      const card = document.createElement("div");
      card.className = "dia-card";

      const titulo = document.createElement("p");
      titulo.className = "dia-titulo";
      titulo.textContent = formatarRotuloDia(dia.data);
      card.appendChild(titulo);

      const grade = document.createElement("div");
      grade.className = "slots";

      dia.disponiveis.forEach(function (horario) {
        const horaInicio = parseInt(horario.split(":")[0], 10);
        const horaFim = horaInicio + 4;
        const rotulo = horario + " - " + horaFim.toString().padStart(2, "0") + ":00";

        const botao = document.createElement("div");
        botao.textContent = rotulo;
        botao.className = "slot";
        botao.addEventListener("click", function () {
          limparErro();
          document.querySelectorAll(".slot.selecionado").forEach(function (el) {
            el.classList.remove("selecionado");
          });
          botao.classList.add("selecionado");
          horarioSelecionado = dia.data + "T" + horario + ":00";
          botaoConfirmar.disabled = false;
        });

        grade.appendChild(botao);
      });

      card.appendChild(grade);
      areaDias.appendChild(card);
    });

  } catch (erro) {
    console.error(erro);
    areaDias.innerHTML = "";
    mostrarErro("Não foi possível carregar os horários: " + (erro.message || "erro desconhecido"));
  }
}

botaoConfirmar.addEventListener("click", async function () {
  if (!horarioSelecionado) return;

  limparErro();
  botaoConfirmar.disabled = true;
  botaoConfirmar.textContent = "Confirmando...";

  try {
    const { data: novoAgendamento, error } = await db
      .from("agendamentos")
      .insert({
        cliente_id: clienteId,
        veiculo_id: veiculoId,
        data_hora: horarioSelecionado
      })
      .select("id")
      .single();

    if (error) {
      if (error.code === "23505") {
        await carregarProximosDiasComVaga();
        mostrarErro("Esse horário acabou de ser reservado por outra pessoa. Escolha outro.");
        return;
      }
      throw error;
    }

    window.location.href = "status.html?agendamento_id=" + novoAgendamento.id;

  } catch (erro) {
    console.error(erro);
    mostrarErro("Não foi possível confirmar: " + (erro.message || "erro desconhecido"));
  } finally {
    botaoConfirmar.disabled = false;
    botaoConfirmar.textContent = "Confirmar horário";
  }
});

carregarProximosDiasComVaga();
</script>

</body>
</html>

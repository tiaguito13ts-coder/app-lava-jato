<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Agendar lavagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #B08A2E;
  --dourado-escuro: #8F701F;
  --marinho: #1B3350;
  --preto: #16140F;
  --creme: #FAF8F4;
  --pedra: #D8D3C8;
  --texto-secundario: #6B6862;
  --branco: #FFFFFF;
  --erro-bg: #FBEAE6;
  --erro-texto: #7A2E22;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--creme);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--preto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 24px; }
.topo img { width: 84px; height: auto; margin-bottom: 12px; }
.topo .marca {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin: 0;
}
.linha-assinatura {
  width: 48px;
  height: 2px;
  background: var(--dourado);
  margin: 10px auto 0;
}
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 4px;
}
p.hint { font-size: 13px; color: var(--texto-secundario); margin: 0 0 22px; }
label {
  font-size: 12px;
  color: var(--texto-secundario);
  display: block;
  margin-bottom: 4px;
  font-weight: 500;
}
input[type="text"],
input[type="tel"] {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 14px;
  border: 1px solid var(--pedra);
  border-radius: 6px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: var(--branco);
  color: var(--preto);
}
input:focus {
  outline: none;
  border-color: var(--dourado);
  box-shadow: 0 0 0 3px rgba(176, 138, 46, 0.15);
}
button.primario {
  width: 100%;
  padding: 13px;
  background: var(--dourado);
  color: var(--preto);
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.15s;
}
button.primario:hover:not(:disabled) { background: var(--dourado-escuro); }
button.primario:disabled { background: var(--pedra); color: var(--texto-secundario); cursor: default; }
button.primario:focus-visible { outline: 2px solid var(--marinho); outline-offset: 2px; }
.mensagem-erro {
  font-size: 12px;
  color: var(--erro-texto);
  background: var(--erro-bg);
  padding: 8px 10px;
  border-radius: 6px;
  margin: -4px 0 14px;
  display: none;
}
.mensagem-erro.visivel { display: block; }
</style>
</head>
<body>

<div class="tela">
  <div class="topo">
    <img src="logo.png" alt="No Capricho — Estética Automotiva">
    <div class="linha-assinatura"></div>
  </div>

  <h1>Vamos agendar sua lavagem</h1>
  <p class="hint">Preencha seus dados e os do seu veículo</p>

  <form id="form-cadastro">
    <label for="nome">Seu nome</label>
    <input type="text" id="nome" placeholder="Maria Silva" required>

    <label for="telefone">Seu telefone (com DDD)</label>
    <input type="tel" id="telefone" placeholder="11999998888" required>

    <label for="placa">Placa do veículo</label>
    <input type="text" id="placa" placeholder="ABC1D23" required>

    <label for="modelo">Modelo</label>
    <input type="text" id="modelo" placeholder="Onix">

    <label for="cor">Cor</label>
    <input type="text" id="cor" placeholder="Prata">

    <p class="mensagem-erro" id="mensagem-erro"></p>

    <button type="submit" class="primario" id="botao-continuar">Continuar</button>
  </form>
</div>

<!-- Biblioteca oficial do Supabase para JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("form-cadastro");
const botao = document.getElementById("botao-continuar");
const mensagemErro = document.getElementById("mensagem-erro");

function mostrarErro(texto) {
  mensagemErro.textContent = texto;
  mensagemErro.classList.add("visivel");
}
function limparErro() {
  mensagemErro.classList.remove("visivel");
}

form.addEventListener("submit", async function (evento) {
  evento.preventDefault();
  limparErro();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const placa = document.getElementById("placa").value.trim();
  const modelo = document.getElementById("modelo").value.trim();
  const cor = document.getElementById("cor").value.trim();

  botao.disabled = true;
  botao.textContent = "Salvando...";

  try {
    const { data: clienteExistente, error: erroBusca } = await db
      .from("clientes")
      .select("id")
      .eq("telefone", telefone)
      .maybeSingle();

    if (erroBusca) throw erroBusca;

    let clienteId;

    if (clienteExistente) {
      clienteId = clienteExistente.id;
    } else {
      const { data: novoCliente, error: erroCriarCliente } = await db
        .from("clientes")
        .insert({ nome: nome, telefone: telefone })
        .select("id")
        .single();

      if (erroCriarCliente) throw erroCriarCliente;
      clienteId = novoCliente.id;
    }

    const { data: novoVeiculo, error: erroVeiculo } = await db
      .from("veiculos")
      .insert({
        cliente_id: clienteId,
        placa: placa,
        modelo: modelo || null,
        cor: cor || null
      })
      .select("id")
      .single();

    if (erroVeiculo) throw erroVeiculo;

    window.location.href =
      "horarios.html?cliente_id=" + clienteId + "&veiculo_id=" + novoVeiculo.id;

  } catch (erro) {
    console.error(erro);
    mostrarErro("Não foi possível salvar: " + (erro.message || "erro desconhecido"));
    botao.disabled = false;
    botao.textContent = "Continuar";
  }
});
</script>

</body>
</html>

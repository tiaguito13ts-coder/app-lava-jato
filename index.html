<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Capricho — Agendar lavagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --dourado: #C9A445;
  --dourado-escuro: #B08A2E;
  --fundo: #0E0D0B;
  --superficie: #1B1815;
  --borda: #33302A;
  --texto: #F5F1E8;
  --texto-secundario: #A69C89;
  --texto-botao: #14130F;
  --erro-bg: #3A1F1B;
  --erro-texto: #E0958A;
}
* { box-sizing: border-box; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--fundo);
  margin: 0;
  padding: 40px 16px;
  display: flex;
  justify-content: center;
  color: var(--texto);
}
.tela { width: 100%; max-width: 360px; }
.topo { text-align: center; margin-bottom: 26px; }
.topo .icone-marca { width: 84px; height: auto; margin-bottom: 8px; }
.topo .nome-marca {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--texto);
  margin: 0;
}
.topo .tagline-marca {
  font-size: 10px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--texto-secundario);
  margin: 3px 0 0;
}
.linha-assinatura { width: 44px; height: 2px; background: var(--dourado); margin: 14px auto 0; }
h1 {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 4px;
  color: var(--texto);
}
p.hint { font-size: 13px; color: var(--texto-secundario); margin: 0 0 22px; }
label {
  font-size: 12px;
  color: var(--texto-secundario);
  display: block;
  margin-bottom: 4px;
  font-weight: 500;
}
input[type="text"],
input[type="tel"] {
  width: 100%;
  padding: 11px 12px;
  margin-bottom: 14px;
  border: 1px solid var(--borda);
  border-radius: 6px;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  background: var(--superficie);
  color: var(--texto);
}
input::placeholder { color: #6B6659; }
input:focus { outline: none; border-color: var(--dourado); box-shadow: 0 0 0 3px rgba(201, 164, 69, 0.18); }
.campo { position: relative; margin-bottom: 14px; }
.campo .icone-campo {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  line-height: 1;
  pointer-events: none;
}
.campo input { padding-left: 42px; margin-bottom: 0; }
button.primario {
  width: 100%;
  padding: 13px;
  background: var(--dourado);
  color: var(--texto-botao);
  border: none;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  font-family: 'Inter', sans-serif;
  cursor: pointer;
  margin-top: 4px;
  transition: background 0.15s;
}
button.primario:hover:not(:disabled) { background: #DDB65A; }
button.primario:disabled { background: var(--borda); color: var(--texto-secundario); cursor: default; }
button.primario:focus-visible { outline: 2px solid var(--dourado); outline-offset: 2px; }
.mensagem-erro {
  font-size: 12px;
  color: var(--erro-texto);
  background: var(--erro-bg);
  padding: 8px 10px;
  border-radius: 6px;
  margin: -4px 0 14px;
  display: none;
}
.mensagem-erro.visivel { display: block; }
</style>
</head>
<body>

<div class="tela">
  <div class="topo">
    <img src="icone-carro.png" alt="" class="icone-marca">
    <p class="nome-marca">No Capricho</p>
    <p class="tagline-marca">Estética automotiva</p>
    <div class="linha-assinatura"></div>
  </div>

  <h1>Vamos agendar sua lavagem</h1>
  <p class="hint">Preencha seus dados e os do seu veículo</p>

  <form id="form-cadastro">
    <label for="nome">Seu nome</label>
    <div class="campo">
      <span class="icone-campo">👤</span>
      <input type="text" id="nome" placeholder="Maria Silva" required>
    </div>

    <label for="telefone">Seu telefone (com DDD)</label>
    <div class="campo">
      <span class="icone-campo">📱</span>
      <input type="tel" id="telefone" placeholder="31956324859" required>
    </div>

    <label for="placa">Placa do veículo</label>
    <div class="campo">
      <span class="icone-campo">🔢</span>
      <input type="text" id="placa" placeholder="ABC1D23" required>
    </div>

    <label for="modelo">Modelo</label>
    <div class="campo">
      <span class="icone-campo">🚘</span>
      <input type="text" id="modelo" placeholder="Onix">
    </div>

    <label for="cor">Cor</label>
    <div class="campo">
      <span class="icone-campo">🎨</span>
      <input type="text" id="cor" placeholder="Prata">
    </div>

    <p class="mensagem-erro" id="mensagem-erro"></p>

    <button type="submit" class="primario" id="botao-continuar">Continuar</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
const SUPABASE_URL = "https://ezndgpgeqitwfnwyszqt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_GjPh3mo9yJ-qtaJGTqsuaQ_iU-IpckC";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("form-cadastro");
const botao = document.getElementById("botao-continuar");
const mensagemErro = document.getElementById("mensagem-erro");

function mostrarErro(texto) {
  mensagemErro.textContent = texto;
  mensagemErro.classList.add("visivel");
}
function limparErro() {
  mensagemErro.classList.remove("visivel");
}

form.addEventListener("submit", async function (evento) {
  evento.preventDefault();
  limparErro();

  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const placa = document.getElementById("placa").value.trim();
  const modelo = document.getElementById("modelo").value.trim();
  const cor = document.getElementById("cor").value.trim();

  botao.disabled = true;
  botao.textContent = "Salvando...";

  try {
    const { data: clienteExistente, error: erroBusca } = await db
      .from("clientes")
      .select("id")
      .eq("telefone", telefone)
      .maybeSingle();

    if (erroBusca) throw erroBusca;

    let clienteId;

    if (clienteExistente) {
      clienteId = clienteExistente.id;
    } else {
      const { data: novoCliente, error: erroCriarCliente } = await db
        .from("clientes")
        .insert({ nome: nome, telefone: telefone })
        .select("id")
        .single();

      if (erroCriarCliente) throw erroCriarCliente;
      clienteId = novoCliente.id;
    }

    const { data: novoVeiculo, error: erroVeiculo } = await db
      .from("veiculos")
      .insert({
        cliente_id: clienteId,
        placa: placa,
        modelo: modelo || null,
        cor: cor || null
      })
      .select("id")
      .single();

    if (erroVeiculo) throw erroVeiculo;

    window.location.href =
      "horarios.html?cliente_id=" + clienteId + "&veiculo_id=" + novoVeiculo.id;

  } catch (erro) {
    console.error(erro);
    mostrarErro("Não foi possível salvar: " + (erro.message || "erro desconhecido"));
    botao.disabled = false;
    botao.textContent = "Continuar";
  }
});
</script>

</body>
</html>
